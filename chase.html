<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>CHASE FLUENT</title><style>:root{--bg:#0b1020;--fg:#eef2ff;--mut:#9aa6c4;--card:#141b33;--acc:#7c5cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}a{color:#b6a6ff}header,main{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:.2em 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs a,.tabs button{background:var(--card);color:var(--fg);border:1px solid #2a3560;border-radius:10px;padding:10px 14px;text-decoration:none;font:inherit;min-height:44px}.tabs .on{background:var(--acc)}.note{color:var(--mut);max-width:70ch}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.card{background:var(--card);border:1px solid #2a3560;border-radius:12px;overflow:hidden}.card img{width:100%;display:block;max-height:240px;object-fit:cover;object-position:top;background:#fff}.card .t{padding:8px 10px;font-size:.85rem}.card .t b{word-break:break-all}.b{display:flex;gap:6px;padding:0 10px 10px}.b button{flex:1;min-height:44px;border-radius:8px;border:1px solid #2a3560;background:#0f1530;color:var(--fg);font:inherit}.b .ok.on{background:#1f7a4d}.b .no.on{background:#9a2f3f}dialog{max-width:96vw;max-height:96vh;border:0;background:#000;padding:0;overflow:auto}dialog img{max-width:92vw;display:block}.warn{border-left:4px solid #ffb020;background:#2a2108;padding:8px 12px;border-radius:6px;max-width:70ch}</style></head><body><header><a href="index.html">← all</a><h1>CHASE FLUENT</h1><p class="note">Existing public site and learner app captured from the real build using the founder demo persona (sample data). The pixel-dog artwork anywhere in the game is NOT accepted as the premium Chase; it is shown only because it exists today.</p><div class="tabs" id="tabs"><button data-w="390" class="on">Phone (390)</button><button data-w="1440">Desktop (1440)</button><button id="copy">Copy my decisions</button></div></header><main><div class="grid" id="g"></div></main><dialog id="d"><img id="di" alt=""></dialog><script>
const K="rv-chase";let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
let cur="390";
function show(){document.querySelectorAll(".card").forEach(c=>{c.style.display=c.dataset.w===cur?"":"none";const v=S[c.dataset.w+":"+c.dataset.k];c.querySelector(".ok").classList.toggle("on",v==="ok");c.querySelector(".no").classList.toggle("on",v==="no")});document.querySelectorAll("#tabs button[data-w]").forEach(b=>b.classList.toggle("on",b.dataset.w===cur))}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.w){cur=b.dataset.w;show()}else if(b.id==="copy"){const t=Object.entries(S).map(([k,v])=>v.toUpperCase()+" "+k).join("\n")||"(no decisions yet)";const m="chase\n"+t;if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>alert("Copied"),()=>prompt("Copy:",m));else prompt("Copy:",m)}};
document.getElementById("g").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const b=e.target.closest("button");if(b){S[c.dataset.w+":"+c.dataset.k]=b.classList.contains("ok")?"ok":"no";try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}show();return}const im=e.target.closest("img");if(im){document.getElementById("di").src=im.src;document.getElementById("d").showModal()}};
document.getElementById("d").onclick=()=>document.getElementById("d").close();show();
</script></body></html>
